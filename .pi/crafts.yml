version: 1

policy:
  default_mode: auto
  competitive_modes_opt_in_only: true
  preserve_pi_default_system_prompt: true

modes:
  lite:
    graph: "R -> S"
    use_for:
      - docs
      - config
      - scaffolding
      - simple_single_file_change

  full:
    graph: "C -> R -> A -> F -> T -> S"
    use_for:
      - business_logic
      - multi_file_change
      - domain_boundary
      - persistence
      - api_contract
      - trust_boundary

  competitive_standard:
    graph: "C -> parallel[R -> A(opposing) -> F] -> Synthesis -> T -> F -> S"
    opt_in_only: true
    candidates: 2
    isolation: git_worktree
    require_provider_diversity: true

  competitive_high_risk:
    graph: "C -> parallel[R -> A(opposing) -> F -> T -> F] -> Synthesis -> T -> F -> S"
    opt_in_only: true
    candidates: 2
    isolation: git_worktree
    require_provider_diversity: true
    final_security_review_required: true

model_classes:
  frontier_reasoning:
    roles: [planner, synthesizer]
    preferred: [claude-opus-4.8, gpt-5.5]
    fallback: fail_closed

  senior_coding:
    roles: [builder, security]
    preferred: [gpt-5.5, claude-sonnet-5]
    fallback: [gpt-5.4, claude-sonnet-4.5]

  medium_competitive:
    roles: [competitive_builder, competitive_reviewer]
    require_different_provider_for_opposing_review: true
    preferred_by_provider:
      openai: [gpt-5.4, gpt-5-mini-high]
      anthropic: [claude-sonnet-5, claude-sonnet-4.5]
      google: [gemini-pro]
    fallback: fail_if_no_provider_diversity

  fast_review:
    roles: [docs_review, style_review]
    only_for: [docs, style, simple_diff]

security:
  mandatory_review_triggers:
    - auth
    - authorization
    - public_api
    - webhooks
    - payments
    - subscriptions
    - tenant_isolation
    - migrations
    - pii
    - secrets
    - background_jobs
    - idempotency

artifacts:
  required_fields:
    - summary
    - changed_files
    - patch_path
    - tests_run
    - test_output_summary
    - acceptance_criteria_status
    - risks
    - open_questions
    - recommended_next_step

failure_policy:
  max_candidates: 2
  max_retries_per_phase: 1
  failed_tests: return_to_builder_once_then_fail
  review_blockers: require_fix_or_documented_disagreement
  synthesis_conflict: choose_single_base_patch_then_port_minimal_improvements
  security_blocker: require_fix_before_pr
  timeout: fail_phase_and_report
